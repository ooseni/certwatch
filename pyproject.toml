[project]
name = "certwatch"
version = "0.1.0"
description = "Serverless SSL/TLS certificate expiry monitor on AWS"
requires-python = ">=3.14"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: needs the stack deployed to LocalStack; run with `make ls-test`"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
# E/F: errors, I: import order, B: bugbear, UP: modern syntax, S: security (bandit)
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S310"]  # plain asserts are the point of tests; urlopen only reaches LocalStack
